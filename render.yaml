services:
  - type: web
    name: reposentry
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx tsx src/hosted.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LIVE_RUN_ENABLED
        value: "false"
      - key: ARMORIQ_API_KEY
        sync: false
      - key: ARMORIQ_USER_ID
        sync: false
      - key: ARMORIQ_AGENT_ID
        sync: false
      - key: ARMORIQ_MCP_NAME
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MCP_TRANSPORT_SECRET
        generateValue: true
